name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: liquid-glass-debug-apk, path: app/build/outputs/apk/debug/*.apk }
      # Always keep the newest APK at Releases > "latest" so it can be downloaded straight to the phone.
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LiquidGlass.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest LiquidGlass.apk --prerelease --title "Liquid Glass (آخر نسخة)" \
            --notes "نزّل LiquidGlass.apk وثبّته. مبني من ${GITHUB_SHA::7}."

  fonts:
    # Lock-screen clock fonts (install like the ones in the reference video; pick them under "More fonts").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install fonttools shapely pillow
      - run: python3 fontpack/gen_fonts.py build/fonts
      - run: fontpack/build_apks.sh build/fonts build/apks app/glass-debug.keystore
      - uses: actions/upload-artifact@v4
        with: { name: depth-clock-fonts, path: "build/apks/*.apk" }
      - name: Publish fonts
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd build/apks && zip -q ../DepthClockFonts.zip *.apk && cd ..
          cp fonts/preview.png DepthClockPreview.png
          gh release delete fonts -y --cleanup-tag || true
          gh release create fonts DepthClockFonts.zip DepthClockPreview.png --prerelease --target "$GITHUB_SHA" \
            --title "خطوط ساعة Depth" --notes "فك الـ ZIP وثبّت الـ APK اللي تبيه، وبعدها من محرر شاشة القفل: الساعة > الخط > المزيد."
